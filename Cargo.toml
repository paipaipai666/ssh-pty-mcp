[package]
name = "ssh-pty-mcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "MCP server giving AI agents fluent SSH: persistent PTY sessions, virtual keyboard, screen model, SFTP"
authors = ["pai <2921839932@qq.com>"]
repository = "https://github.com/paipaipai666/ssh-pty-mcp"
homepage = "https://github.com/paipaipai666/ssh-pty-mcp"
keywords = ["mcp", "ssh", "pty", "agent", "sftp"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
rmcp = { version = "3", features = ["transport-io"] }
tokio = { version = "1", features = ["full", "test-util"] }
russh = { version = "=0.62.4", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shellexpand = "3"
ssh2-config = "0.2"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
